on:
    workflow_call:
      inputs:
        go_private:
          description: Private go modules
          default: "github.com/klever-io/*"
          required: false
          type: string
        go_version:
          description: Custom GO Version
          required: false
          type: string
          default: "1.22"
        cache_enabled:
          description: Enable caching of Go modules
          default: true
          required: false
          type: boolean
      secrets:
        git_user:
          required: false
        git_pass:
          required: false
jobs:
    setup:
      runs-on: klever-pipe
      env:
        GO_PRIVATE: ${{ inputs.go_private }} # Set the private module env

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Golang
          uses: actions/setup-go@v5
          with:
            go-version: ${{ inputs.go_version }}
            cache: false

        - name: Configure git for private modules
          if: env.TOKEN != ''
          run: git config --global url."https://${USER}:${TOKEN}@github.com".insteadOf "https://github.com"

        - name: Cache Go dependencies
          id: cache_vendor
          if: ${{ inputs.cache_enabled }}
          uses: actions/cache@v4
          env:
            cache-name: cache-vendor
          with:
            path: |
              ~/go/pkg/mod
              ./vendor
            key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/go.sum') }}
            restore-keys: |
              ${{ runner.os }}-${{ env.cache-name }}-
            enableCrossOsArchive: true

        # Resolving a package to a module
        - name: Resolve package to module && Download dependencies
          if: ${{ steps.cache_vendor.outputs.cache-hit != 'true' }}
          run: |
            go mod tidy
            go mod download

        - name: Generate Vendor and Install modvendor
          run: |
            go install github.com/goware/modvendor@latest
            go mod vendor
            modvendor -copy="**/*.c **/*.h **/*.proto **/*.a"

        # Verify no changes from go mod tidy
        - name: Verify no changes from go mod tidy
          run: |
            go mod tidy
            if [ -n "$(git status --porcelain)" ]; then
              echo "Changes found after go mod tidy:"
              git status --porcelain
              exit 1
            fi
