name: Release Docker

on:
  workflow_dispatch:
    inputs:
      label:
        type: choice
        description: 'Release Type'
        required: true
        default: 'mainnet'
        options:
          - mainnet
          - testnet
          - devnet
      latest:
        type: boolean
        description: 'Push Latest Image'
        required: false
        default: false
    
jobs:
  config:
    uses: ./.github/workflows/go-setup.yaml
    secrets:
      git_user: ${{ secrets.GIT_USER }}
      git_pass: ${{ secrets.GIT_PASS }}

  build:
    needs: [config]
    runs-on: klever-pipe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ vars.GO_VERSION || '1.22' }}


      - name: Cache Go dependencies
        uses: actions/cache@v4
        env:
          cache-name: cache-vendor
        with:
          fail-on-cache-miss: true
          path: |
            ~/go/pkg/mod
            ./vendor
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/go.sum') }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Set env and build docker image
        env:
          LABEL: ${{ github.event.inputs.label }}
        run: |
          if [[ $LABEL == 'testnet' ]]; then
            export FOR_TESTNET=1
          elif [[ $LABEL == 'devnet' ]]; then
            export FOR_DEV=1
          fi
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/goware/modvendor@latest
          make docker-build
          make docker-push
    
      - name: Push latest image
        env:
          LABEL: ${{ github.event.inputs.label }}
        if: ${{ github.event.inputs.latest == 'true' }}
        run: |
          if [[ $LABEL == 'devnet' ]]; then
            docker push kleverapp/klever-go:dev-latest
          elif [[ $LABEL == 'testnet' ]]; then
            docker push kleverapp/klever-go:latest-testnet
          elif [[ $LABEL == 'mainnet' ]]; then
            docker push kleverapp/klever-go:latest
          fi

