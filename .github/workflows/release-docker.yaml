name: Release Docker

on:
  workflow_dispatch:
    inputs:
      label:
        type: choice
        description: 'Release Type'
        required: true
        default: 'mainnet'
        options:
          - mainnet
          - testnet
          - devnet
      latest:
        type: boolean
        description: 'Push Latest Image'
        required: false
        default: false
      flavor:
        type: choice
        description: 'Image Flavor'
        required: true
        default: 'all'
        options:
          - all
          - full-debian
          - validator-debian
          - full-alpine
          - validator-alpine

permissions:
  contents: read

jobs:
  setup-and-lint:
    uses: ./.github/workflows/go-setup-lint.yaml
    with:
      go-version: ${{ vars.GO_VERSION }}
      golangci-lint-version: ${{ vars.GOLANGCI_VERSION || 'v2.15.0' }}

  build-multi-arch:
    needs: [setup-and-lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - flavor: full-debian
            dockerfile: docker/Dockerfile
            target: docker-buildx-full
            enabled: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'full-debian' }}
          - flavor: validator-debian
            dockerfile: docker/Dockerfile.validator
            target: docker-buildx-validator
            enabled: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'validator-debian' }}
          - flavor: full-alpine
            dockerfile: docker/Dockerfile.alpine
            target: docker-buildx-alpine-full
            enabled: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'full-alpine' }}
          - flavor: validator-alpine
            dockerfile: docker/Dockerfile.alpine.validator
            target: docker-buildx-alpine-validator
            enabled: ${{ github.event.inputs.flavor == 'all' || github.event.inputs.flavor == 'validator-alpine' }}

    steps:
      - name: Checkout repository
        if: ${{ matrix.enabled }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Go Setup
        if: ${{ matrix.enabled }}
        uses: ./.github/actions/go-setup-action
        with:
          go-version: ${{ vars.GO_VERSION }}
          # Release output must not come from a cache that other jobs write
          cache-enabled: 'false'

      - name: Set up QEMU
        if: ${{ matrix.enabled }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        if: ${{ matrix.enabled }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Login to Docker Hub
        if: ${{ matrix.enabled }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Set environment variables
        if: ${{ matrix.enabled }}
        env:
          LABEL: ${{ github.event.inputs.label }}
          LATEST: ${{ github.event.inputs.latest }}
        run: |
          if [[ $LABEL == 'testnet' ]]; then
            echo "FOR_TESTNET=-testnet" >> $GITHUB_ENV
          elif [[ $LABEL == 'devnet' ]]; then
            echo "FOR_DEV=dev-" >> $GITHUB_ENV
          fi
          if [[ $LATEST == 'true' ]]; then
            echo "PUSH_LATEST=1" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        if: ${{ matrix.enabled }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/goware/modvendor@v0.5.0

      - name: Build and push multi-arch image
        if: ${{ matrix.enabled }}
        run: |
          make ${{ matrix.target }}
