name: Tests Dispatch

on:
  workflow_dispatch:
    inputs:
      go_version:
        description: Custom Go version (empty uses the version in go.mod)
        required: false
        type: string
        default: ""
      verbose:
        description: Verbose mode
        required: false
        type: boolean
        default: false
      run_unit_tests:
        description: Run unit tests
        required: false
        type: boolean
        default: true
      run_integration_tests:
        description: Run integration tests
        required: false
        type: boolean
        default: true
      run_kvm_tests:
        description: Run kvm tests
        required: false
        type: boolean
        default: true

env:
  GO_VERSION: ${{ inputs.go_version }}

permissions:
  contents: read

jobs:
  setup-and-lint:
    uses: ./.github/workflows/go-setup-lint.yaml
    with:
      go-version: ${{ inputs.go_version }}
      golangci-lint-version: ${{ vars.GOLANGCI_VERSION || 'v2.15.0' }}

  unit-tests:
    if: ${{ inputs.run_unit_tests }}
    needs: [setup-and-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go Setup
        uses: ./.github/actions/go-setup-action
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: ensure all unit test is passing
        env:
          verbose: ${{ inputs.verbose }}
        run: |
          make tests-unit
  
  integration-tests:
    if: ${{ inputs.run_integration_tests }}
    needs: [setup-and-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go Setup
        uses: ./.github/actions/go-setup-action
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: integration tests
        env:
            verbose: ${{ inputs.verbose }}
        run: |
          make tests-integration

  kvm-tests:
    if: ${{ inputs.run_kvm_tests }}
    needs: [setup-and-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go Setup
        uses: ./.github/actions/go-setup-action
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: ensure all unit test is passing
        env:
          verbose: ${{ inputs.verbose }}
        run: |
          make tests-kvm
