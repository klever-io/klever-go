name: End-To-End Tests - Testnet
on: workflow_dispatch

jobs:
  config:
    uses: ./.github/workflows/go-setup.yaml
    secrets:
      git_user: ${{ secrets.GIT_USER }}
      git_pass: ${{ secrets.GIT_PASS }}

  e2e-tests:
    needs: [config]
    runs-on: klever-pipe
    env:
      E2E_NODE_URL: ${{ secrets.E2E_TESTNET_NODE_URL }}
      E2E_PROXY_URL: ${{ secrets.E2E_TESTNET_PROXY_URL }}
      E2E_PRIVATE_KEYS: ${{ secrets.E2E_TESTNET_PRIVATE_KEYS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ vars.GO_VERSION || '1.22' }}
          cache: false

      - name: Cache Go dependencies
        uses: actions/cache@v4
        env:
          cache-name: cache-vendor
        with:
          fail-on-cache-miss: true
          path: |
            ~/go/pkg/mod
            ./vendor
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/go.sum') }}

      - name: Run End-To-End Tests
        run: |
          make e2e-tests