name: Main Branch Push

on:
  push:
    branches:
      - master
      - develop

jobs:
  config:
    uses: ./.github/workflows/go-setup.yaml
    secrets:
      git_user: ${{ secrets.GIT_USER }}
      git_pass: ${{ secrets.GIT_PASS }}

  validate-and-build:
    needs: [config]
    runs-on: klever-pipe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ vars.GO_VERSION || '1.22' }}

      - name: Cache Go dependencies
        uses: actions/cache@v4
        env:
          cache-name: cache-vendor
        with:
          fail-on-cache-miss: true
          path: |
            ~/go/pkg/mod
            ./vendor
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/go.sum') }}

      - name: GoImports Formatter
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go mod tidy
          make goimports

      # If there are any diffs from goimports or go mod tidy, fail.
      - name: Verify no changes from goimports and go mod tidy
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            exit 1
          fi

      - name: ensure code is buildable
        run: |
          go vet -unsafeptr=false $(go list ./... | grep -v /vendor/) 

      - name: Build
        run: |
          make build-operator
          make build-validator
          
      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            bin/operator
            bin/validator
            kvm/wasmer2/libvmexeccapi.so
            kvm/wasmer2/libvmexeccapi.dylib
            kvm/wasmer2/libvmexeccapi_arm.dylib
