name: Main Branch Push

on:
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  setup-and-lint:
    uses: ./.github/workflows/go-setup-lint.yaml
    with:
      go-version: ${{ vars.GO_VERSION }}
      golangci-lint-version: ${{ vars.GOLANGCI_VERSION || 'v2.15.0' }}

  validate-and-build:
    needs: [setup-and-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Go Setup
        uses: ./.github/actions/go-setup-action
        with:
          go-version: ${{ vars.GO_VERSION }}

      - name: Build
        run: |
          make build-operator
          make build-validator
          
      - name: Save artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            bin/operator
            bin/validator
            kvm/wasmer2/libvmexeccapi.so
            kvm/wasmer2/libvmexeccapi.dylib
            kvm/wasmer2/libvmexeccapi_arm.dylib
