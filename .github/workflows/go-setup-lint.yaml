name: Go Setup and Lint

on:
  workflow_call:
    inputs:
      go-version:
        description: 'The Go version to use. Empty uses the version in go.mod.'
        required: false
        type: string
        default: ''
      go-private:
        required: false
        type: string
        default: 'github.com/klever-io/*'
      golangci-lint-version:
        required: false
        type: string
        default: 'latest'
    secrets:
      git-user:
        required: false
      git-pass:
        required: false
    outputs:
      lint-results:
        description: "Lint results from golangci-lint"
        value: ${{ jobs.setup-and-lint.outputs.lint-results }}

jobs:
  setup-and-lint:
    runs-on: klever-pipe
    outputs:
      lint-results: ${{ steps.lint.outputs.results }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Go Setup
        uses: ./.github/actions/go-setup-action
        with:
          go-version: ${{ inputs.go-version }}
          go-private: ${{ inputs.go-private }}
          git-user: ${{ secrets.git-user }}
          git-pass: ${{ secrets.git-pass }}

      - name: GoImports Formatter
        run: |
          # Pinned, not @latest: x/tools v0.50.0 raised its go directive to 1.26.0, and this
          # runner sets GOTOOLCHAIN=local against go.mod's Go 1.25, so @latest fails to install and
          # breaks the lint job on every branch. v0.49.0 is the newest release that still
          # supports 1.25 and is what @latest resolved to until v0.50.0 shipped.
          go install golang.org/x/tools/cmd/goimports@v0.49.0
          go mod tidy
          make goimports

      - name: Verify no changes from goimports
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            exit 1
          fi

      - name: Ensure code is buildable
        run: |
          go vet -unsafeptr=false $(go list ./... | grep -v /vendor/)

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint-version }}
          install-only: true

      - name: Run golangci-lint
        run: |
          golangci-lint run --output.checkstyle.path=golangci-report.xml || true

      - name: Upload lint results
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: golangci-report.xml
          retention-days: 1
          overwrite: true