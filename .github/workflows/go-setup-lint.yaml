name: Go Setup and Lint

on:
  workflow_call:
    inputs:
      go-version:
        description: 'The Go version to use. Empty uses the version in go.mod.'
        required: false
        type: string
        default: ''
      golangci-lint-version:
        required: false
        type: string
        default: 'v2.15.0'
    outputs:
      lint-results:
        description: "Lint results from golangci-lint"
        value: ${{ jobs.setup-and-lint.outputs.lint-results }}

permissions:
  contents: read

jobs:
  setup-and-lint:
    # KLC-2968: GitHub-hosted, a fresh VM per job; klever-go is public and must not use the
    # shared self-hosted runners
    runs-on: ubuntu-latest
    outputs:
      lint-results: ${{ steps.lint.outputs.results }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Go Setup
        uses: ./.github/actions/go-setup-action
        with:
          go-version: ${{ inputs.go-version }}
          build-cache-key: lint

      - name: GoImports Formatter
        run: |
          # Pinned, not @latest: x/tools v0.50.0 raised its go directive to 1.26.0, and this
          # job sets GOTOOLCHAIN=local against go.mod's Go 1.25, so @latest fails to install and
          # breaks the lint job on every branch. v0.49.0 is the newest release that still
          # supports 1.25 and is what @latest resolved to until v0.50.0 shipped.
          go install golang.org/x/tools/cmd/goimports@v0.49.0
          go mod tidy
          make goimports

      - name: Verify no changes from goimports
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            exit 1
          fi

      - name: Ensure code is buildable
        run: |
          go vet -unsafeptr=false $(go list ./... | grep -v /vendor/)

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}
          install-only: true

      - name: Run golangci-lint
        id: golangci
        run: |
          # SonarQube enforces ordinary findings; execution errors must fail CI.
          golangci-lint run --issues-exit-code=0 \
            --output.checkstyle.path=golangci-report.xml \
            --output.json.path=golangci-report.json

          # Typecheck failures are reported as findings, but prevent complete analysis.
          if ! jq -e 'has("Issues") and all(.Issues[]?; .FromLinter != "typecheck")' golangci-report.json > /dev/null; then
            echo "::error::golangci-lint reported typecheck failures or an invalid report."
            exit 1
          fi
          test -s golangci-report.xml

      # KLC-2968: SonarQube does not run for fork and Dependabot pull requests, so new findings
      # fail lint there instead
      - name: Fail on new golangci-lint findings
        if: |
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: golangci-lint run --new-from-merge-base="origin/$BASE_REF"

      - name: Upload lint results
        if: always() && steps.golangci.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-results
          path: |
            golangci-report.xml
            golangci-report.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true
