name: Go Setup and Lint

on:
  workflow_call:
    inputs:
      go-version:
        description: 'The Go version to use. Empty uses the version in go.mod.'
        required: false
        type: string
        default: ''
      golangci-lint-version:
        required: false
        type: string
        default: 'v2.15.0'
    outputs:
      lint-results:
        description: "Lint results from golangci-lint"
        value: ${{ jobs.setup-and-lint.outputs.lint-results }}

jobs:
  setup-and-lint:
    # KLC-2968: a pull request from a fork runs its own code (Makefile, go test) and must never
    # reach the persistent self-hosted runners, so it runs on a GitHub-hosted one.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'klever-pipe' }}
    outputs:
      lint-results: ${{ steps.lint.outputs.results }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Go Setup
        uses: ./.github/actions/go-setup-action
        with:
          go-version: ${{ inputs.go-version }}

      - name: GoImports Formatter
        run: |
          # Pinned, not @latest: x/tools v0.50.0 raised its go directive to 1.26.0, and this
          # runner sets GOTOOLCHAIN=local against go.mod's Go 1.25, so @latest fails to install and
          # breaks the lint job on every branch. v0.49.0 is the newest release that still
          # supports 1.25 and is what @latest resolved to until v0.50.0 shipped.
          go install golang.org/x/tools/cmd/goimports@v0.49.0
          go mod tidy
          make goimports

      - name: Verify no changes from goimports
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            exit 1
          fi

      - name: Ensure code is buildable
        run: |
          go vet -unsafeptr=false $(go list ./... | grep -v /vendor/)

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint-version }}
          install-only: true

      - name: Run golangci-lint
        id: golangci
        run: |
          # SonarQube enforces ordinary findings; execution errors must fail CI.
          golangci-lint run --issues-exit-code=0 \
            --output.checkstyle.path=golangci-report.xml \
            --output.json.path=golangci-report.json

          # Typecheck failures are reported as findings, but prevent complete analysis.
          if ! jq -e 'has("Issues") and all(.Issues[]?; .FromLinter != "typecheck")' golangci-report.json > /dev/null; then
            echo "::error::golangci-lint reported typecheck failures or an invalid report."
            exit 1
          fi
          test -s golangci-report.xml

      - name: Upload lint results
        if: always() && steps.golangci.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: |
            golangci-report.xml
            golangci-report.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true
