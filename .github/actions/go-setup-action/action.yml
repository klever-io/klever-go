name: 'Go Setup Action'
description: 'Sets up the Go environment, with dependency caching on GitHub-hosted runners'
inputs:
  go-version:
    description: 'The Go version to use. Empty uses the version in go.mod.'
    required: false
    default: ''
  cache-enabled:
    description: 'Enable caching of Go modules'
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Set up Golang
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
        cache: false

    - name: Cache Go dependencies
      id: cache_vendor
      if: inputs.cache-enabled == 'true' && runner.environment == 'github-hosted'
      uses: actions/cache@v6
      env:
        cache-name: go-cache-vendor
      with:
        path: |
          ~/go/pkg/mod
          ./vendor
        key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-${{ env.cache-name }}-

    - name: Resolve package to module & Download dependencies
      if: ${{ steps.cache_vendor.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        go mod tidy
        go mod download

    - name: Generate Vendor and Install modvendor
      if: ${{ steps.cache_vendor.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        go install github.com/goware/modvendor@latest
        go mod vendor
        modvendor -copy="**/*.c **/*.h **/*.proto **/*.a"

    - name: Verify no changes from go mod tidy
      shell: bash
      run: |
        go mod tidy
        if [ -n "$(git status --porcelain)" ]; then
          echo "Changes found after go mod tidy:"
          git status --porcelain
          exit 1
        fi
