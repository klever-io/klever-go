# KLC-2968: actions are pinned to commit SHAs; Dependabot keeps the pins on current releases
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/go-setup-action
    schedule:
      interval: weekly
    # A pin only moves to a release that has been public for a week
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
