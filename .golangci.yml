version: "2"

run:
  timeout: 10m
  build-tags:
    - "integration"
  modules-download-mode: "vendor"

linters:
  default: none
  enable:
    - unused
    - gosec
    - govet
    - staticcheck
    - ineffassign
    - errcheck
  exclusions:
    generated: strict
    rules:
      # Test files: relax errcheck and certain gosec/staticcheck rules
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        linters:
          - gosec
        text: "G104|G301|G304|G404|G115"
      - path: _test\.go
        linters:
          - staticcheck
        text: "ST1012|ST1019|QF"
      - path: "^kvm/vmhost/vmhooks/generate/.*"
        linters:
          - errcheck
          - staticcheck
      # Deprecated crypto APIs (intentional use)
      - path: (cryptoei|vmCrypto)\.go
        linters:
          - staticcheck
        text: "SA1019"
      # CGO unsafe.Pointer (intentional for interop)
      - path: wasmer2ImportsCgoHelper\.go
        linters:
          - govet
        text: "unsafeptr"
