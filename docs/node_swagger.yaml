        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            $ref: '#/definitions/kdafeespool.KDAFeesPoolData'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/shared.GenericAPIResponse'
      summary: returns an poolResponse containing information about the asset pool
      tags:
      - Asset
  /asset/nft/{owner}/{id}:
    get:
