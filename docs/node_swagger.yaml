info:
  contact: {}
  description: This is a sample of the KleverChain Node Server.
  title: KleverChain Node
  version: "1.0"
paths:
  /address/{address}:
    get:
      parameters:
      - description: address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            $ref: '#/definitions/shared.GenericAPIResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/shared.GenericAPIResponse'
      summary: returns an accountResponse
      tags:
      - Address
  /address/{address}/allowance:
    get:
      parameters:
      - description: address
        in: path
        name: address
        required: true
        type: string
      - description: asset
        in: query
        name: asset
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            $ref: '#/definitions/shared.GenericAPIResponse'
        "400":
          description: some error
          schema:
            $ref: '#/definitions/shared.GenericAPIResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/shared.GenericAPIResponse'
      summary: returns the rewards avaible for a specific list of asset in an account
      tags:
      - Address
  /address/{address}/balance:
    get:
      parameters:
      - description: address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            $ref: '#/definitions/shared.GenericAPIResponse'
        "400":
          description: some error
          schema:
            $ref: '#/definitions/shared.GenericAPIResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/shared.GenericAPIResponse'
      summary: returns the balance for the address parameter
      tags:
      - Address
  /address/{address}/nonce:
    get:
      parameters:
      - description: address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            $ref: '#/definitions/shared.GenericAPIResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/shared.GenericAPIResponse'
      summary: returns the rewards avaible for a specific asset in an account
      tags:
      - Address
  /asset/{id}:
    get:
      parameters:
      - description: asset id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            $ref: '#/definitions/kapps.KDAData'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/shared.GenericAPIResponse'
      summary: returns an assetResponse containing information about the asset
      tags:
      - Asset
  /asset/{id}/pool:
    get:
      parameters:
