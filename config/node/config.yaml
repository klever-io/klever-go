p2p:
  node:
    port: 37373-38383
    maximumExpectedPeerCount: 0
    thresholdMinConnectedPeers: 0
    broadcastIP:
  kadDhtPeerDiscovery:
    enabled: true
    refreshIntervalInSec: 10
    protocolID: /klv/kad/0.0.1
    # Seednode addresses in the form /ip4/<ip>/tcp/<port>/p2p/<peerID>. For a local seednode
    # (`make seednode`), copy the peer ID it logs on startup (also the label of its
    # ./config/p2pKey.pem), e.g. /ip4/127.0.0.1/tcp/37373/p2p/<peerID>.
    initialPeerList: []
    bucketSize: 100
    routingTableRefreshIntervalInSec: 300
  sharding:
    targetPeerCount: 75
    maxIntraShardValidators: 25
    maxCrossShardValidators: 0
    maxIntraShardObservers: 15
    maxCrossShardObservers: 0
    #available options:
    #  `ListsSharder` will split the peers based on the shard membership (intra, cross or unknown)
    #  `OneListSharder` will do just the connection triming (upto TargetPeerCount value) not taking into account
    #              the shard membership of the connected peers
    #  `NilListSharder` will disable the sharder's own connection trimming (sharder is off).
    #              It does not disable libp2p's connection manager: every regular node,
    #              whatever the sharder, runs the connection manager configured under
    #              connectionManager below, which protects known validators and caps
    #              unknown inbound peers. Seed nodes always run a no-op connection manager.
    type: NilListSharder
  # libp2p ResourceManager tuning. Available strategies:
  #   ""        on a regular node, the same as "scaled" with 4096 MiB (an in-code
  #             default, so configs from before this section existed get the values
  #             below); on a seed node, libp2p's auto-scaled DefaultResourceManager.
  #   "default" libp2p's auto-scaled DefaultResourceManager (memory budget =
  #             TotalRAM/8): 64 + 8*GB inbound and 128 + 16*GB total (GB of host RAM),
  #             128/256 on an 8 GB host, too few for a ~200-validator network.
  #   "null"    disable libp2p resource limits (bounded only by OS ulimit and RAM).
  #   "scaled"  auto-scale limits as if the host had `scaledMemoryMiB` MiB of memory.
  # Shipped default (KLC-2417): "scaled" with 4096 MiB, giving up to 64 + 4096/16 =
  # 320 inbound and 640 total connections. It is lower if the host reports less than
  # 4096 MiB of RAM (the value is clamped to physical memory) or if RLIMIT_NOFILE/2 is
  # below what those connections need. The value is an accounting ceiling, not memory
  # the node reserves. The optional maxConns*/connRate* knobs (see
  # config/seednode/config.yaml) are left unset, so libp2p's per-IP limits keep their
  # defaults (8 connections per /32). On regular nodes "scaled" also limits each peer
  # ID to 4 inbound connections (libp2p's default is 8), so one identity
  # cannot hold many inbound slots; seed nodes keep libp2p's per-peer limits.
  resourceManager:
    strategy: scaled
    scaledMemoryMiB: 4096
  # libp2p connection manager of regular nodes (seed nodes ignore it and never trim).
  # lowWater and highWater count connections, not peers. Once the connection count
  # reaches highWater, the node closes the connections of the lowest-value unprotected
  # peers older than gracePeriodInSec until lowWater unprotected, out-of-grace
  # connections remain. Which peers go first follows their connection-manager value,
  # which gossipsub's decaying pubsub-deliveries tags dominate (peers that deliver
  # messages first are kept), not whether they are unknown or observers. Protected
  # peers are never closed and their connections are not counted against lowWater:
  # validators the node knows of, and the peers gossipsub and kad-dht protect. lowWater
  # is therefore the connection budget for unprotected peers, and lowWater plus the
  # protected peers' inbound connections must stay below the inbound ResourceManager
  # limit (320 above): 100 plus ~200 validators fits. With a larger lowWater,
  # unprotected peers could hold every inbound slot without a trim ever closing them. The node warns at startup when the watermarks do not fit the
  # ResourceManager limits. A zero or missing value selects the default shown here;
  # lowWater must stay below highWater, both at most 100000, gracePeriodInSec at most
  # 3600.
  #
  # Trimming never closes a connection younger than gracePeriodInSec, so a peer that
  # keeps rotating its peer ID and reconnecting would never be trimmed. To close that
  # gap, the node caps the inbound connections of peers that are not known validators
  # and not protected by gossipsub or kad-dht at maxUnprotectedInboundConns. It counts
  # connections, as the ResourceManager does, because one peer ID can hold several.
  # At admission, a new inbound connection from such a peer is refused once the cap
  # is reached, so freed slots cannot be refilled by an attacker ahead of a
  # reconnecting validator; validators per the node's records and protected peers are
  # always admitted, and outbound connections are never refused. A validator with a
  # new peer ID is admitted once its heartbeat reaches this node: seed nodes never
  # refuse, so the heartbeat gossips through them within ~25s. Every 10s the node also
  # closes whole peers, whatever their age, until the sum is within the cap.
  # Closing order: unknown peers connected for over 60s, newest first; then observers
  # (any peer can become an "observer" with a self-signed heartbeat), newest first;
  # last, unknown peers younger than 60s, oldest first, because a validator that has
  # just connected is unknown until its next heartbeat (every 20-25s). The cap is
  # armed once the node's peer shard resolver is installed and enforced 60s later, so
  # reconnecting validators are identified and protected first. 0 or missing means
  # 100; at most 100000. The node warns at startup if it is not below the inbound limit.
  connectionManager:
    lowWater: 100
    highWater: 300
    gracePeriodInSec: 60
    maxUnprotectedInboundConns: 100
  # Optional caps on the inbound direct-send streams this node accepts (KLC-2433).
  # Omitting this section, or leaving a knob at 0, keeps the built-in defaults:
  # 4 streams per peer and 512 across all peers. A well-behaved peer reuses a
  # single direct-send stream, so the per-peer default is headroom for
  # reset/reopen churn; the node-wide cap bounds reader goroutines when a source
  # rotates peer identities. Raise them only if legitimate traffic is refused —
  # the node logs "refusing inbound direct stream" when a cap is hit. Negative
  # values are a configuration error and the node refuses to start.
  #
  # maxSeenMessages caps the direct-send replay cache, which rejects a repeated
  # (peer, sequence number) inside a 120s window. Every peer gets a fixed share of
  # 64 identifiers, so the cache tracks maxSeenMessages/64 peers (2048 by default)
  # and a peer's own traffic is the only thing that can shorten its own window. A
  # peer arriving while every slot is held by a peer active in the last 120s is
  # not tracked, and so not deduplicated, until one of them goes quiet. The node
  # warns when that happens ("direct-send replay cache full"), at most once per
  # 120s; if you see it, raise this value. Memory is about 2.5 KiB per tracked peer,
  # allocated only as peers appear, so the value is a ceiling and raising it is
  # cheap. 0 means the default; a positive value below 64 is rejected at startup,
  # since one peer share is the smallest real cap.
  #
  # directSend:
  #   maxInboundStreamsPerPeer: 4
  #   maxInboundStreamsTotal: 512
  #   maxSeenMessages: 131072

logs:
  logFileLifeSpanInSec: 86400
  logFileSizeSpanInSec: 60
  maxFileSize: 104857600
  maxBackups: 10

ntp:
  hosts:
    - time.google.com
    - time.cloudflare.com
    - time.windows.com
    - time.apple.com
  port: 123
  timeoutMilliseconds: 500
  syncPeriodSeconds: 3600
  version: 0

preferences:
  # NodeDisplayName represents the friendly name a user can pick for his node in the status monitor
  nodeDisplayName:
  # Identity represents the keybase's identity
  identity:
  # RedundancyLevel represents the level of redundancy used by the node (-1 = disabled, 0 = main instance (default),
  # 1 = first backup, 2 = second backup, etc.)
  # Main and backup machines must never share a p2p key file (--p2p-key-pem-file): a backup with the main machine's
  # peer ID cannot see the main as active and starts signing with the same validator key. Do not copy p2pKey.pem
  # along with validatorKey.pem. A backup ignores the default key path and loads one only when --p2p-key-pem-file is set.
  redundancyLevel: 0
  # statics pooling interval
  statusPollingIntervalSec: 2
  # MaxComputableSlots represents the max number of slots computable in a round
  # by the validator statistics processor
  maxComputableSlots: 100

blockSizeThrottleConfig:
  minSizeInBytes: 104857 # 104857 is 10% from 1MB
  maxSizeInBytes: 943718 # 943718 is 90% from 1MB

softwareVersionConfig:
  stableTagLocation: "https://api.github.com/repos/klever-io/klever-go/releases/latest"
  pollingIntervalInMinutes: 65

