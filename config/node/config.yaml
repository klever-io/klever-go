      sizeInBytes: 20971520 #20MB
    db:
      filePath: Logs
      type: LvlDBSerial
      batchDelaySeconds: 2
      maxBatchSize: 100
      maxOpenFiles: 10

debug:
  interceptorResolver:
    enabled: true
    enablePrint: true
    cacheSize: 10000
    intervalAutoPrintInSeconds: 20
    numRequestsThreshold: 9
    numResolveFailureThreshold: 3
    debugLineExpiration: 10

  antiflood:
    enabled: true
    cacheSize: 10000
    intervalAutoPrintInSeconds: 20

antiflood:
  enabled: true
  numConcurrentResolverJobs: 50
  fastReacting:
    intervalInSeconds: 1
    reservedPercent: 20.0
    peerMaxInput:
      baseMessagesPerInterval: 140
      totalSizePerInterval: 4194304 #4MB/s
      increaseFactor:
        threshold: 10 #if consensus size will exceed this value, then
        factor: 1.0 #increase the base value with [factor*consensus size]
    blackList:
      thresholdNumMessagesPerInterval: 1000
      thresholdSizePerInterval: 8388608 #8MB/s
      numFloodingSlots: 10
      peerBanDurationInSeconds: 300

  slowReacting:
    intervalInSeconds: 30
    reservedPercent: 20.0
    peerMaxInput:
      baseMessagesPerInterval: 6000
      totalSizePerInterval: 33554432 # 32MB/interval
      increaseFactor:
        threshold: 10 #if consensus size will exceed this value, then
        factor: 0.0 #increase the base value with [factor*consensus size]
    blackList:
      thresholdNumMessagesPerInterval: 10000
      thresholdSizePerInterval: 37748736 # 36MB/interval
      numFloodingSlots: 2
      peerBanDurationInSeconds: 3600

  outOfSpecs:
    intervalInSeconds: 1
    reservedPercent: 0.0
    peerMaxInput:
      baseMessagesPerInterval: 2000
      totalSizePerInterval: 10485760 # 10MB/interval
      increaseFactor:
        threshold: 0 #if consensus size will exceed this value, then
        factor: 0.0 #increase the base value with [factor*consensus size]
    blackList:
      thresholdNumMessagesPerInterval: 3600
      thresholdSizePerInterval: 12582912 # 12MB/interval
      numFloodingSlots: 2
      peerBanDurationInSeconds: 3600

  peerMaxOutput:
    baseMessagesPerInterval: 75
    totalSizePerInterval: 2097152 #2MB/s

  cache:
    name: Antiflood
    capacity: 7000
    type: LRU

  topic:
    defaultMaxMessagesPerSec: 35000
    maxMessages:
      - topic: heartbeat
        numMessagesPerSec: 70
      - topic: blocks
        numMessagesPerSec: 30

  webServer:
    # SimultaneousRequests represents the number of concurrent requests accepted by the web server
    # this is a global throttler that acts on all http connections regardless of the originating source
    simultaneousRequests: 100
    # SameSourceRequests defines how many requests are allowed from the same source in the specified
    # time frame (SameSourceResetIntervalInSec)
    sameSourceRequests: 10000
    # SameSourceResetIntervalInSec time frame between counter reset, in seconds
    sameSourceResetIntervalInSec: 1
    # WebSocketConnections caps simultaneous live /subscribe WebSocket connections node-wide.
    # Neither throttler above bounds live WS connections: simultaneousRequests releases its slot
    # at the HTTP->WS upgrade, and sameSourceRequests counts requests until its periodic reset,
    # so a long-lived socket costs it one request. 0 = unlimited.
    webSocketConnections: 4096
    # WebSocketConnectionsPerIP caps simultaneous live /subscribe connections from a single
    # source IP. Behind a reverse proxy every client shares the proxy IP, so raise this (or set
    # 0 to disable) for proxied/public deployments. 0 = unlimited.
    webSocketConnectionsPerIP: 1024
    # LogWebSocketConnections caps simultaneous live /log WebSocket connections node-wide.
    # Each live /log connection registers a process-global log observer, so every log line is
    # formatted and fanned out once per connection. Keep this small: /log is an operator
    # diagnostic route, not a public feed. 0 = built-in default (32); this cap cannot be
    # disabled, so set a high value rather than 0 to lift it.
    logWebSocketConnections: 32
    # LogWebSocketConnectionsPerIP caps simultaneous live /log connections from a single
    # source IP. Behind a reverse proxy every client shares the proxy IP, so raise this (or set
    # 0 to disable) for proxied deployments — it is much tighter than webSocketConnectionsPerIP
    # above, so it is the one that will bite first. 0 = unlimited.
    logWebSocketConnectionsPerIP: 8
    # LogWebSocketAllowedOrigins lists the browser origins allowed to open /log. Clients that
    # send no Origin header (the log viewer, curl, wscat) are always allowed; a browser is only
    # allowed on an exact match, so the empty default blocks web pages while leaving normal
    # tooling working. Add an entry (e.g. "https://ops.example.com") only for a browser-based
    # log viewer you run yourself.
    logWebSocketAllowedOrigins: []
    # WebSocketMaxAddressesPerSubscribe caps addresses accepted in one /subscribe call. The
    # inbound frame read limit is derived from this so a maximal subscribe always fits. 0 = default.
    webSocketMaxAddressesPerSubscribe: 10000
    # WebSocketMaxAddressesPerClient caps the total addresses one connection may watch across all
    # of its subscribe calls. 0 = default.
    webSocketMaxAddressesPerClient: 50000
    # WebSocketPostWorkers bounds concurrent postWSConnection mirror requests. 0 = default.
    webSocketPostWorkers: 8
    # WebSocketPostQueueSize bounds pending mirror sends queued behind webSocketPostWorkers
    # before new ones are dropped. 0 = default.
    webSocketPostQueueSize: 1000
    # EndpointsThrottlers represents a map for maximum simultaneous go routines for an endpoint
    endpointsThrottlers:
      - endpoint: /transaction/:hash
        maxNumGoRoutines: 10
      - endpoint: /transaction/send
        maxNumGoRoutines: 2

  txAccumulator:
    # MaxAllowedTimeInMilliseconds is used as a time frame in which the node gathers transactions.
    # After this period, collected transactions will be sent on the p2p topics
    maxAllowedTimeInMilliseconds: 250
    # MaxDeviationTimeInMilliseconds represents the time in milliseconds that will cause the effectual time frame be
    # less than the specified max value. This is used to create desynchronizations between senders as to not
    # clutter the network exactly in the same moment
    maxDeviationTimeInMilliseconds: 25

