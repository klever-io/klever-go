maxNodesChangeEnableEpoch:
  - epochEnable: 0
    nodesToShuffle: 4

enableEpochs:
  # Claim KFI enable epoch
  claimKFI: 0
  # TX Processor Cacher Flow && ITO Price updates
  processorFlowITOPrice: 0
  # FPR/Staking flow
  fixStakingBuckets: 0
  # KDA FPR flow
  kdaFpr: 0
  # Compute APR and FPR with big Buckets
  bigBucketsCompute: 0
  # Compute FPR int Amount and Kda Fee Flow
  fprComputeAndKdaFeeFlow: 0
  # Fix Delegation step on same epoch
  fixDelegationSameEpoch: 0
  # SmartContracts
  smartContracts: 0
  # Audit Changes
  fixAuditChanges: 0
  # Epoch Rewards V2
  epochRewardsV2: 0
  # Audit Changes V2
  fixAuditChangesV2: 0
  # Overflow / mint-past-bound guards: market buy settlement and split
  # royalties (GHSA-p7gw-2pcp-5pf8), and SFT add-quantity circulation
  # overflow (GHSA-mrpp-v6pg-p54x).
  # Also starts the account freeze: once scheduled at a real (non-zero) epoch,
  # fixAuditChangesV4 MUST be strictly greater, or the freeze window for the
  # accounts released at that fork is empty. The node refuses to start otherwise.
  fixMarketBuyOverflow: 0
  # Audit Changes V3 (reject non-positive kdaFeesPool fee ratios + range-check
  # swap price) + block indirect dispatch of the upgrade lifecycle hook
  fixAuditChangesV3: 0
  # Audit Changes V4
  # Also releases the frozen swap-service account: must be after fixMarketBuyOverflow.
  fixAuditChangesV4: 0
  # Sort the leaving list before the consensus backfill promotion, so the
  # promoted subset no longer depends on validator-info input order.
  # Live networks must set this to an epoch after the last validator has
  # upgraded: leaving it at 0 during a rolling upgrade activates the new
  # ordering immediately on upgraded nodes while older binaries keep the
  # legacy ordering.
  fixJailedPromotionOrder: 0
gasSchedule:
  gasScheduleByEpochs:
    - startEpoch: 0
      fileName: "config/node/gasScheduleV1.yaml"
